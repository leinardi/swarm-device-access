[[decision]]
id = "d1"
question = "Where does docs/rust-port.md live? (G3, G10)"
answer = "Moved to docs/internal/rust-port.md, every citation updated. Owner, 2026-11-24."

[[decision]]
id = "d2"
question = "Where does docs/release.md live, and is there a user-facing release page? (G3, G8, G10)"
answer = "As in swarm-scheduler-exporter: moved to docs/internal/release.md, the Go 1.x notes split to docs/internal/history/go-releases.md, every citation updated, and a published verifying-releases.md added. Owner, 2026-11-24."

[[decision]]
id = "d3"
question = "Does the README reference material move into published pages in this stage? (G8, R4, G10)"
answer = "Yes: getting-started, deployment, host-requirements, configuration, labels, migration, tips, security and alternatives, with every README citation repointed. Owner, 2026-11-24."

[[decision]]
id = "d4"
question = "Where does the Field test section of docs/testing.md go? (G2, G10)"
answer = "Split to docs/internal/qa/field-test.md with a status line; field-test.sh citations updated. Owner, 2026-11-24."

[[decision]]
id = "d5"
question = "When are the claims the code contradicts corrected?"
answer = "In this stage, docs only, each rewording recorded in mappings.toml and listed in report.md. Owner, 2026-11-24."

[[decision]]
id = "d6"
question = "Are the stale code comments and example-config comments fixed here? (G10)"
answer = "Yes, as reference line edits; comments only, no behaviour change. Owner, 2026-11-24."

[[decision]]
id = "d7"
question = "What do the docs say about the minimum Docker Engine?"
answer = "Drop the claim that the client refuses older engines; keep that it negotiates the API version; the minimum stays a TODO(verify) in report.md. Owner, 2026-11-24."

