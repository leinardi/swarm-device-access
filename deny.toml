#
# cargo-deny: the dependency gate for the Rust workspace. `cargo deny --workspace check` runs every
# section; the advisories section needs the network to be current.

[graph]
all-features = true

[advisories]
# Every vulnerability and unsound advisory fails; "unmaintained" fails for direct and transitive
# crates alike unless ignored here by advisory ID, with a reason. An ignore written as
# `{ crate = "name" }` would only ignore yanked versions, so none is.
version = 2
unmaintained = "all"
yanked = "deny"
# None: the meta crate reads its YAML through repo-meta's serde-saphyr, so serde_yaml_ng and the
# unmaintained unsafe-libyaml (RUSTSEC-2024-0449) under it are gone.
ignore = []

[licenses]
version = 2
# Only the licences the Cargo.lock graph needs, each added by the change that brings in the crate
# needing it. Apache-2.0 is this project's own (every workspace member is Apache-2.0), and the
# dual-licensed dependencies (MIT OR Apache-2.0) are taken under it.
#
# cargo-deny 0.20.2 leaves the workspace members' dev-dependencies out of its graph (`cargo deny
# --workspace list` names only the members while every external crate is a dev-dependency of the
# meta crate), so it checks none of their licences and reports an allowance only they need as not
# encountered. Those licences are still decided here, by hand, rather than by omission.
allow = [
    "Apache-2.0",
    # winnow (MIT only), under toml; memchr and aho-corasick (Unlicense OR MIT), under regex; both
    # under repo-meta, a dependency of the meta library, which only the meta-tests build.
    "MIT",
    # unicode-ident ((MIT OR Apache-2.0) AND Unicode-3.0), under proc-macro2 and syn, which
    # tokio-macros needs for the tests' #[tokio::test].
    "Unicode-3.0",
]
confidence-threshold = 0.9
# encoding_rs ((Apache-2.0 OR MIT) AND BSD-3-Clause, the BSD part for its WHATWG-derived data),
# under serde-saphyr's encoding_rs_io, which repo-meta reads the workflows with: the meta library
# only, which only the meta-tests build. Allowed for that crate alone, not for the graph.
#
# matchit (MIT AND BSD-3-Clause, the BSD part for the httprouter-derived tests of its radix tree),
# under axum's Router, which the metrics server routes with. Allowed for that crate alone.
exceptions = [
    { allow = ["BSD-3-Clause"], crate = "encoding_rs" },
    { allow = ["BSD-3-Clause"], crate = "matchit" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The shared crates (Cargo.toml [workspace.dependencies]), pinned by release tag.
allow-git = ["https://github.com/leinardi/rust-common"]
