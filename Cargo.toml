[workspace]
# Listed explicitly, never as a glob: meta/tests/workspace_lints.rs checks each member's manifest.
members = [".", "meta", "testenv"]
resolver = "3"

[workspace.package]
edition = "2024"
# One exact Rust release, the one rust-toolchain.toml pins.
rust-version = "1.98.1"
license = "Apache-2.0"
authors = ["Roberto Leinardi"]
repository = "https://github.com/leinardi/swarm-device-access"

# The crates shared with the other Rust services, from leinardi/rust-common: a git dependency
# pinned by `rev` (the v0.1.0 commit, or a later commit of the branch that collects the adoption's
# fixes) while the adoption is reviewed, then by release tag. `version` keeps cargo-deny's
# `wildcards = "deny"` satisfied and makes cargo refuse a checkout of another version. Each member
# opts in with `<name>.workspace = true` and its own features. Local work on both repositories: an
# uncommitted `[patch."https://github.com/leinardi/rust-common"]` table naming each crate with
# `path = "../rust-common/crates/<name>"`.
[workspace.dependencies]
docker-engine = { git = "https://github.com/leinardi/rust-common", rev = "925a308e99cdec5af90539818660d10a7e9086f9", version = "0.1" }
go-clock = { git = "https://github.com/leinardi/rust-common", rev = "925a308e99cdec5af90539818660d10a7e9086f9", version = "0.1" }
go-compat = { git = "https://github.com/leinardi/rust-common", rev = "925a308e99cdec5af90539818660d10a7e9086f9", version = "0.1" }
go-http = { git = "https://github.com/leinardi/rust-common", rev = "925a308e99cdec5af90539818660d10a7e9086f9", version = "0.1" }
go-prom = { git = "https://github.com/leinardi/rust-common", rev = "925a308e99cdec5af90539818660d10a7e9086f9", version = "0.1" }
go-slog = { git = "https://github.com/leinardi/rust-common", rev = "925a308e99cdec5af90539818660d10a7e9086f9", version = "0.1" }
repo-meta = { git = "https://github.com/leinardi/rust-common", rev = "925a308e99cdec5af90539818660d10a7e9086f9", version = "0.1" }
service-kit = { git = "https://github.com/leinardi/rust-common", rev = "925a308e99cdec5af90539818660d10a7e9086f9", version = "0.1" }
testenv-core = { git = "https://github.com/leinardi/rust-common", rev = "925a308e99cdec5af90539818660d10a7e9086f9", version = "0.1" }

# The lint set lives here once. Every member opts in with `[lints] workspace = true` (a member does
# not inherit it otherwise, and the meta crate asserts that each one does), and every clippy run is
# workspace-wide.
[workspace.lints.rust]
# deny, not forbid: one audited module, src/cgroup/bpf_sys.rs, has to lift it for the raw bpf(2)
# calls, and only #[expect] can lift a denied lint (forbid cannot be lifted at all). The meta crate
# pins that list (meta/tests/unsafe_allowlist.rs).
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Only `#[expect(lint, reason = "...")]` may silence a lint: it fails once the lint stops firing,
# and the reason is mandatory. Every one is counted by scripts/check-suppressions.sh.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# No panics outside tests; clippy.toml allows both in tests.
unwrap_used = "deny"
expect_used = "deny"
# Output goes through the logger, or an explicit writeln! to a handle.
print_stdout = "deny"
print_stderr = "deny"
# A match on an enum names every variant, so a new variant is a compile-time decision everywhere.
wildcard_enum_match_arm = "deny"
# Descriptive names; clippy's default allow-list applies.
min_ident_chars = "deny"
# The wall-clock ban in clippy.toml is only enforced if the lint is.
disallowed_methods = "deny"

[package]
name = "swarm-device-access"
version = "0.0.0"
description = "Injects cgroup device rules into Docker Swarm containers that bind-mount /dev paths"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Go's formatting and parsing, byte for byte (rust-common): durations, floats, quoting, time
# layouts, the local zone, errno texts, strconv, filepath, scanner, sort.
go-compat.workspace = true
# The injected wall clock (rust-common): Clock, SystemClock, TokioClock, FakeClock.
go-clock.workspace = true
# Go's log/slog handlers and the plain format, byte for byte (rust-common), in the Raw plain
# style with Go's fallback level and format parsing, through a LogHandle.
go-slog.workspace = true
# The Prometheus Go client's registry and text exposition, byte for byte (rust-common), with
# prometheus/common v0.70.1's content negotiation (ExpfmtVersion::V0_70_1).
go-prom.workspace = true
# Go's net/http server on hyper (rust-common): the mux's answers, header order and framing, the
# four server deadlines, net.Listen's bind and the drain, for the metrics and health endpoints.
go-http.workspace = true
# The flags (Q1). No color: help and errors are plain text, as Go's were.
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
# Zone data (TZif parsing) and civil time only: the zone is resolved and the times are formatted
# the way Go does (go-compat), so none of jiff's tzdb or system features is on.
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
# The config file's YAML events; tag resolution, the shape checks and the strict decode are
# ported from yaml.v3 in-tree (src/config/yaml), so no YAML value model or serde is used.
saphyr-parser = { version = "0.3.2", default-features = false }
# The Docker Engine client (rust-common), moby client v0.6.0's requests and error texts on a
# unix socket: `write` for the launcher's calls (Client::exchange) and `attach` for its hijacked
# attach, moby's stdcopy and the wait answer. No `tcp` or `tls`: the socket is the only endpoint.
# The daemon reaches it through src/docker, the launcher's writes through src/launcher/engine.rs
# only (meta/tests/docker_boundary.rs, meta/tests/launcher_boundary.rs).
docker-engine = { workspace = true, features = ["write", "attach"] }
# The launcher's write requests and the hijacked attach on docker-engine's transport; the metrics
# and health endpoints' status type (their server is go-http's).
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "http1"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
# The typed Engine API answers the daemon and the launcher read (docker-engine decodes them).
serde = { version = "1.0.229", features = ["derive"] }
# The cgroup directory descriptor and the openat, fstat and open calls on it, getrandom for the
# wrapper nonce, openat2 beneath /dev, and the pidfd and its poll, without unsafe.
rustix = { version = "1.1.6", default-features = false, features = [
    "std",
    "fs",
    "rand",
    "system",
    "process",
    "event",
] }
# The raw bpf(2) syscall, in src/cgroup/bpf_sys.rs only.
libc = "0.2.191"
# The digest of the original program in the device filter wrapper's header, as Go's crypto/sha256.
sha2 = { version = "0.11.1", default-features = false }
# The systemd reload watcher's system bus connection, on the tokio runtime only: no default
# runtime, proxies or object server, and so no async-io or blocking thread pool.
zbus = { version = "6.1.0", default-features = false, features = ["tokio"] }
# The poll of the watcher's signal streams; zbus's own Stream trait.
futures-core = { version = "0.3.34", default-features = false }
# CancellationToken, Go's context cancellation, and the TaskTracker that awaits the processor's
# blocking transactions.
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
# The timer TokioClock follows, the tasks and their locks, the systemd watcher's unix socket and
# select!, the launcher's output pump and its stdout and stderr, the multi-threaded runtime main
# builds, and the SIGINT, SIGTERM and SIGHUP watches.
tokio = { version = "1.54.1", default-features = false, features = [
    "time",
    "net",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "io-util",
    "io-std",
    "macros",
] }

[dev-dependencies]
# TempDir, eventually and OrPanic, which the unit and wire tests share.
docker-engine = { workspace = true, features = ["write", "attach", "test-util"] }
# The golden fixtures, the wire captures and the decode errors of the tests.
serde_json = "1.0.154"
# The Go tests' gatherSeries and seriesID, for the collectors' tests.
go-prom = { workspace = true, features = ["testing"] }
# The Go wire captures' replay (Capture, replay).
go-http = { workspace = true, features = ["testing"] }
# The fake Engine of tests/parity.rs: hyper's HTTP/1 server.
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
# The paused clock (start_paused) needs the test runtime.
tokio = { version = "1.54.1", default-features = false, features = [
    "time",
    "rt",
    "macros",
    "test-util",
    "net",
    "io-util",
    "sync",
] }

[features]
# Builds the tests that load BPF programs into the running kernel (tests/bpf_privileged.rs). They
# need CAP_BPF and CAP_SYS_ADMIN, attach nothing, and run only on throwaway hosts:
# cargo test --features privileged-tests --test bpf_privileged, as root.
privileged-tests = []

[[test]]
name = "bpf_privileged"
required-features = ["privileged-tests"]

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
strip = true
# abort, not unwind (swarm-scheduler-exporter unwinds for its catch_unwind, which this daemon does
# not have): the Go daemon has no recover, so a panic crashes the process and Swarm or the launcher
# restarts it. A task panic under unwind would leave a daemon that looks alive and does nothing.
panic = "abort"

# The meta-tests scan the whole tree with regexes; unoptimised, regex compilation and matching
# dominate their run time. Only the regex crates are optimised in dev and test builds, which costs
# a few seconds on a clean build and nothing on an incremental one; the workspace's own code stays
# at opt-level 0 for debugging.
[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3
