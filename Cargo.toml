[workspace]
# Listed explicitly, never as a glob: meta/tests/workspace_lints.rs checks each member's manifest.
members = [".", "meta", "testenv"]
resolver = "3"

[workspace.package]
edition = "2024"
# One exact Rust release, the one rust-toolchain.toml pins.
rust-version = "1.98.1"
license = "Apache-2.0"
authors = ["Roberto Leinardi"]
repository = "https://github.com/leinardi/swarm-device-access"

# The crates shared with the other Rust services, from leinardi/rust-common: a git dependency
# pinned by the release tag (`tag = "v0.4.0"`) with `version = "0.4"`, the tag's <major>.<minor>.
# `version` keeps cargo-deny's `wildcards = "deny"` satisfied and makes cargo refuse a checkout of
# another version. Moving the pin: change the `tag` (and `version` with it) on every rust-common
# line, run `cargo fetch` (not `cargo update -p`), and `git diff Cargo.lock` touches only the
# rust-common packages' lines. Each member opts in with `<name>.workspace = true` and its own
# features. Local work on both repositories: an uncommitted
# `[patch."https://github.com/leinardi/rust-common"]` table naming each crate with
# `path = "../rust-common/crates/<name>"`.
[workspace.dependencies]
docker-client = { git = "https://github.com/leinardi/rust-common", tag = "v0.4.0", version = "0.4" }
clock = { git = "https://github.com/leinardi/rust-common", tag = "v0.4.0", version = "0.4" }
repo-meta = { git = "https://github.com/leinardi/rust-common", tag = "v0.4.0", version = "0.4" }
prometheus-client = { version = "0.25.2", default-features = false }
service-kit = { git = "https://github.com/leinardi/rust-common", tag = "v0.4.0", version = "0.4" }
testenv-core = { git = "https://github.com/leinardi/rust-common", tag = "v0.4.0", version = "0.4" }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-setup = { git = "https://github.com/leinardi/rust-common", tag = "v0.4.0", version = "0.4" }

# The lint set lives here once. Every member opts in with `[lints] workspace = true` (a member does
# not inherit it otherwise, and the meta crate asserts that each one does), and every clippy run is
# workspace-wide.
[workspace.lints.rust]
# deny, not forbid: one audited module, src/cgroup/bpf_sys.rs, has to lift it for the raw bpf(2)
# calls, and only #[expect] can lift a denied lint (forbid cannot be lifted at all).
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Only `#[expect(lint, reason = "...")]` may silence a lint: it fails once the lint stops firing,
# and the reason is mandatory.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# No panics outside tests; clippy.toml allows both in tests.
unwrap_used = "deny"
expect_used = "deny"
# Output goes through the logger, or an explicit writeln! to a handle.
print_stdout = "deny"
print_stderr = "deny"
# A match on an enum names every variant, so a new variant is a compile-time decision everywhere.
wildcard_enum_match_arm = "deny"
# Descriptive names; clippy's default allow-list applies.
min_ident_chars = "deny"
# The wall-clock ban in clippy.toml is only enforced if the lint is.
disallowed_methods = "deny"

[package]
name = "swarm-device-access"
version = "0.0.0"
description = "Injects cgroup device rules into Docker Swarm containers that bind-mount /dev paths"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The injected wall clock (rust-common): Clock, SystemClock, TokioClock, FakeClock.
clock.workspace = true
# The log: tracing events, written as tracing-subscriber's text lines or flat JSON through
# rust-common's tracing-setup (a reloadable subscriber for SIGHUP).
tracing.workspace = true
tracing-setup.workspace = true
# The metrics: the registry, the counters, gauges and histogram, and the OpenMetrics text encoder.
prometheus-client.workspace = true
# The routes of the metrics and health endpoints; the router only, no axum server.
axum = { version = "0.8.9", default-features = false }
# The wildcard listener: dual-stack with IPV6_V6ONLY off, which tokio's TcpSocket cannot set.
socket2 = { version = "0.6.5", default-features = false }
# The flags (Q1). No color: help and errors are plain text, as Go's were.
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
# Zone data (TZif parsing) and civil time only: Docker's RFC 3339 timestamps are parsed and the
# local zone is resolved, so none of jiff's tzdb or system features is on.
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
# The config file's YAML events; tag resolution, the shape checks and the strict decode are
# ported from yaml.v3 in-tree (src/config/yaml), so no YAML value model or serde is used.
saphyr-parser = { version = "0.3.2", default-features = false }
# The policy globs: device-allow and device-deny patterns, matched case-sensitively with `/` never
# matched by `*`, `?` or a class (Q17).
glob = "0.3.3"
# The Docker Engine client (rust-common): bollard on the unix socket, a whole-call timeout, an error
# with a kind, the attach and wait pumps (`attach`). No `tcp` or `tls`: the socket is the only
# endpoint. The daemon reaches it through src/docker, the launcher's writes through
# src/launcher/engine.rs only (meta/tests/docker_boundary.rs, meta/tests/launcher_boundary.rs).
docker-client = { workspace = true, features = ["attach"] }
# The create body: the launcher's daemon spec (Go's JSON, built by hand) decoded into bollard's
# model, which docker-client re-exports.
serde_json = "1.0.154"
# The derives of the cgroup types.
serde = { version = "1.0.229", features = ["derive"] }
# The cgroup directory descriptor and the openat, fstat and open calls on it, getrandom for the
# wrapper nonce, openat2 beneath /dev, and the pidfd and its poll, without unsafe.
rustix = { version = "1.1.6", default-features = false, features = [
    "std",
    "fs",
    "rand",
    "system",
    "process",
    "event",
] }
# The raw bpf(2) syscall, in src/cgroup/bpf_sys.rs only.
libc = "0.2.191"
# The digest of the original program in the device filter wrapper's header, as Go's crypto/sha256.
sha2 = { version = "0.11.1", default-features = false }
# The systemd reload watcher's system bus connection, on the tokio runtime only: no default
# runtime, proxies or object server, and so no async-io or blocking thread pool.
zbus = { version = "6.1.0", default-features = false, features = ["tokio"] }
# The poll of the watcher's signal streams; zbus's own Stream trait.
futures-core = { version = "0.3.34", default-features = false }
# CancellationToken, Go's context cancellation, and the TaskTracker that awaits the processor's
# blocking transactions.
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
# The timer TokioClock follows, the tasks and their locks, the systemd watcher's unix socket and
# select!, and the launcher's output pump and its stdout and stderr.
tokio = { version = "1.54.1", default-features = false, features = [
    "time",
    "net",
    "rt",
    "sync",
    "io-util",
    "io-std",
    "macros",
] }
# The runtime main builds (two workers, its shutdown bounded by the budget's deadline) and the
# SIGINT, SIGTERM and SIGHUP watches it hands run_with, all installed at once (rust-common).
service-kit = { workspace = true, features = ["runtime", "process-metrics", "http"] }

[dev-dependencies]
# The fake Engine on a unix socket that the docker and launcher tests share.
docker-client = { workspace = true, features = ["attach", "test-util"] }
# The log capture of the unit tests (Capture, set_default).
tracing-setup = { workspace = true, features = ["testing"] }
# The fake Engine of tests/parity.rs: hyper's HTTP/1 server.
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
# The paused clock (start_paused) needs the test runtime; tests/parity.rs builds a multi-threaded
# one.
tokio = { version = "1.54.1", default-features = false, features = [
    "time",
    "rt",
    "rt-multi-thread",
    "macros",
    "test-util",
    "net",
    "io-util",
    "sync",
] }

[features]
# Builds the tests that load BPF programs into the running kernel (tests/bpf_privileged.rs). They
# need CAP_BPF and CAP_SYS_ADMIN, attach nothing, and run only on throwaway hosts:
# cargo test --features privileged-tests --test bpf_privileged, as root.
privileged-tests = []

[[test]]
name = "bpf_privileged"
required-features = ["privileged-tests"]

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
strip = true
# abort, not unwind (swarm-scheduler-exporter unwinds for its catch_unwind, which this daemon does
# not have): the Go daemon has no recover, so a panic crashes the process and Swarm or the launcher
# restarts it. A task panic under unwind would leave a daemon that looks alive and does nothing.
panic = "abort"

# Line tables only for the workspace and no debug info for the dependencies: backtraces keep
# their files and lines, and the debug and test binaries shrink to a fraction of their size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The meta-tests scan the whole tree with regexes; unoptimised, regex compilation and matching
# dominate their run time. Only the regex crates are optimised in dev and test builds, which costs
# a few seconds on a clean build and nothing on an incremental one; the workspace's own code stays
# at opt-level 0 for debugging.
[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3
