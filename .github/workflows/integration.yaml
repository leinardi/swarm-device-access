name: Integration tests

on:
  pull_request:
  push:
    branches:
      - master
      - devel

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

# Nothing by default: every job states the permissions it needs.
permissions: {}

jobs:
  # The integration suite (the testenv crate) against the image built from the shipped Dockerfile,
  # and the binary copied out of it; make test-integration builds both, pulls the pinned 1.x image
  # the identity control and the upgrade test run, and owns the suite deadline, so CI and local runs
  # share one source of truth. The toolchain is the exact release of rust-toolchain.toml; the Rust
  # cache is saved only on a pull request, as in ci.yaml.
  #
  # The image builds from dhi.io bases, which need a login. A pull request from another repository
  # (a fork) gets no secrets, so it cannot build the image the whole suite runs against, and the
  # suite is not run: the job says so with a warning, and the push to master that merges it runs
  # the suite in full. The gate is where the pull request comes from, never whether the secret is
  # set: a same-repo pull request or a push without DHI_TOKEN is a misconfiguration and fails.
  integration:
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'integration (fork: not run)' || 'integration' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # A pull request whose head is another repository. Not head.repo.fork,
      # which is also true for this repository's own branches when the
      # repository itself is a GitHub fork.
      FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

    steps:
      - name: Checkout
        if: env.FROM_FORK != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        if: env.FROM_FORK != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1

      - name: Cache the Rust build
        if: env.FROM_FORK != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'pull_request' }}

      - name: Require the dhi.io token
        if: env.FROM_FORK != 'true'
        env:
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          if [ -z "$DHI_TOKEN" ]; then
            echo "::error::DHI_TOKEN is not set; the integration suite is mandatory outside fork pull requests"
            exit 1
          fi

      - name: Log in to Docker Hardened Images (dhi.io)
        if: env.FROM_FORK != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ vars.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      # The enforcement flags turn every missing prerequisite into a failure,
      # and the SKIP check makes sure a green run really exercised BPF and the
      # cross-language upgrade and rollback test.
      - name: Run the integration tests
        if: env.FROM_FORK != 'true'
        env:
          SDA_IT_ENFORCE: "1"
          SDA_IT_REQUIRE_RELOAD: "1"
        run: |
          set -o pipefail
          make test-integration 2>&1 | tee integration.log
          if grep -E -- '^[[:space:]]*--- SKIP' integration.log; then
            echo "::error::integration tests were skipped; SDA_IT_ENFORCE=1 requires every test to run"
            exit 1
          fi

      - name: Report that a fork pull request does not run the suite
        if: env.FROM_FORK == 'true'
        run: |
          echo "::warning::The integration suite was not run: it needs the image built from the dhi.io bases, and a fork pull request gets no dhi.io token. It runs on the push to master that merges this pull request."
