# V4L2 (webcam / capture card) passthrough example for Docker Swarm
#
# Passes /dev/video0 into a worker container for video capture.
#
# Prerequisites:
#   - V4L2 device present at /dev/video0 on the host
#   - v4l-utils or ffmpeg available in the worker image
#
# Deploy:
#   docker stack deploy -c docker-compose.yaml v4l2-example

services:
  swarm-device-access:
    image: ghcr.io/leinardi/swarm-device-access:1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Swarm rejects privileged/cgroup/pid/userns on services. The launcher runs
    # unprivileged and creates the daemon container from this same image, with
    # the privileged set the daemon needs.
    command:
      - launch
      # Launcher flags. Reapply device rules after systemctl daemon-reload:
      # - -dbus
      # Bind a host config directory read-only at /etc/swarm-device-access:
      # - -config-dir=/etc/swarm-device-access
      - --
      # Daemon flags, passed to the daemon verbatim.
      # Reload the config file with: docker kill -s HUP swarm-device-access
      # - -config=/etc/swarm-device-access/config.yaml
      # Restrict to V4L2 devices only:
      # - -device-allow=/dev/video*
    # Leaves time for the launcher to stop the daemon and drain its logs.
    stop_grace_period: 30s
    deploy:
      mode: global
      restart_policy:
        condition: any
      update_config:
        order: stop-first

  v4l2-worker:
    image: linuxserver/ffmpeg:latest # dclint disable-line service-image-require-explicit-tag
    volumes:
      - /dev/video0:/dev/video0
      - /tmp/output:/output
    # Capture 5 seconds of video from /dev/video0
    command:
      - -f
      - v4l2
      - -i
      - /dev/video0
      - -t
      - "5"
      - /output/capture.mp4
    # Use top-level labels: so they reach the container; deploy.labels: are ignored.
    labels:
      swarm-device-access.enable: "true"
      swarm-device-access.device-allow: "/dev/video*"
    deploy:
      mode: replicated
      replicas: 1
