# USB device passthrough example for Docker Swarm
#
# Passes /dev/bus/usb (entire USB bus) into a worker container.
# The daemon walks the directory and applies a rule per USB device file.
#
# Prerequisites:
#   - USB device connected and visible at /dev/bus/usb on the host
#
# Deploy:
#   docker stack deploy -c docker-compose.yaml usb-example

services:
  swarm-device-access:
    image: ghcr.io/leinardi/swarm-device-access:1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Swarm rejects privileged/cgroup/pid/userns on services. The launcher runs
    # unprivileged and creates the daemon container from this same image, with
    # the privileged set the daemon needs.
    command:
      - launch
      # Launcher flags. Reapply device rules after systemctl daemon-reload:
      # - -dbus
      # Bind a host config directory read-only at /etc/swarm-device-access:
      # - -config-dir=/etc/swarm-device-access
      - --
      # Daemon flags, passed to the daemon verbatim.
      # Reload the config file with: docker kill -s HUP swarm-device-access
      # - -config=/etc/swarm-device-access/config.yaml
      # Restrict to USB bus devices only. Nodes are /dev/bus/usb/<bus>/<device>,
      # and * does not match across "/", so the glob needs both levels:
      # - -device-allow=/dev/bus/usb/*/*
    # Leaves time for the launcher to stop the daemon and drain its logs.
    stop_grace_period: 30s
    deploy:
      mode: global
      restart_policy:
        condition: any
      update_config:
        order: stop-first

  usb-worker:
    image: ubuntu:24.04
    volumes:
      # Bind-mount the entire USB bus; the daemon will apply rules to each device.
      - /dev/bus/usb:/dev/bus/usb
    command: [ "lsusb" ]
    # Use top-level labels: so they reach the container; deploy.labels: are ignored.
    labels:
      swarm-device-access.enable: "true"
      swarm-device-access.device-allow: "/dev/bus/usb/*/*"
    deploy:
      mode: replicated
      replicas: 1
