# GPU passthrough example for Docker Swarm
#
# Runs the swarm-device-access daemon globally (one instance per node)
# and a CUDA worker service that bind-mounts the NVIDIA device files.
#
# Prerequisites on each node:
#   - NVIDIA driver installed
#   - /dev/nvidia0, /dev/nvidiactl, /dev/nvidia-uvm present
#   - swarm-device-access daemon running (global service below)
#
# Deploy:
#   docker stack deploy -c docker-compose.yaml gpu-example

services:
  cuda-worker:
    image: nvidia/cuda:12.4.0-base-ubuntu22.04
    volumes:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    command: [ "nvidia-smi" ]
    # Use top-level labels: so they reach the container; deploy.labels: are ignored.
    # Required when daemon runs in opt-in mode (the default).
    labels:
      swarm-device-access.enable: "true"
      swarm-device-access.device-allow: "/dev/nvidia*"
    deploy:
      mode: replicated
      replicas: 1
  swarm-device-access:
    image: ghcr.io/leinardi/swarm-device-access:1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Swarm rejects privileged/cgroup/pid/userns on services. The launcher runs
    # unprivileged and creates the daemon container from this same image, with
    # the privileged set the daemon needs.
    command:
      - launch
      # Launcher flags. Reapply device rules after systemctl daemon-reload:
      # - -dbus
      # Bind a host config directory read-only at /etc/swarm-device-access:
      # - -config-dir=/etc/swarm-device-access
      - --
      # Daemon flags, passed to the daemon verbatim.
      # Reload the config file with: docker kill -s HUP swarm-device-access
      # - -config=/etc/swarm-device-access/config.yaml
      # Policy mode: opt-in (the default) processes only labelled containers;
      # all processes every container on the node:
      # - -policy-mode=opt-in
      # Limit scope to NVIDIA devices only:
      # - -device-allow=/dev/nvidia*
    # Leaves time for the launcher to stop the daemon and drain its logs.
    stop_grace_period: 30s
    deploy:
      mode: global
      restart_policy:
        condition: any
      update_config:
        order: stop-first
