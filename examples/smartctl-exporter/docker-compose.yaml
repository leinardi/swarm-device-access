# smartctl-exporter passthrough example for Docker Swarm
#
# Runs smartctl-exporter as a global service so it can read disk health
# metrics from /dev/sg* and /dev/nvme* on every storage node.
# The swarm-device-access daemon injects cgroup BPF device-allow rules at
# container start, replacing the privileged: true that Compose would use.
#
# Prerequisites on each node:
#   - /dev/sd*, /dev/nvme*, or /dev/sg* devices present
#   - /run/udev populated by the host udevd
#   - swarm-device-access daemon running (global service below)
#
# Deploy:
#   docker stack deploy -c docker-compose.yaml smartctl-example

services:
  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:v0.14.0
    volumes:
      # Bind-mount the full /dev tree; daemon will allow each disk device.
      - /dev:/dev:ro
      - /run/udev:/run/udev:ro
    command:
      - --smartctl.interval=5m
      - --smartctl.rescan=30m
      - --web.listen-address=:9633
      - --smartctl.device-exclude=^/dev/(loop|md|zram)
    user: "0:0"
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    security_opt:
      - no-new-privileges=true
    # Use top-level labels: so they reach the container; deploy.labels: are ignored.
    labels:
      swarm-device-access.enable: "true"
      swarm-device-access.device-allow: "/dev/sd*,/dev/nvme*,/dev/sg*,/dev/disk/*"
    deploy:
      mode: global

  swarm-device-access:
    image: ghcr.io/leinardi/swarm-device-access:1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Swarm rejects privileged/cgroup/pid/userns on services. The launcher runs
    # unprivileged and creates the daemon container from this same image, with
    # the privileged set the daemon needs.
    command:
      - launch
      # Launcher flags. Reapply device rules after systemctl daemon-reload:
      # - -dbus
      # Bind a host config directory read-only at /etc/swarm-device-access:
      # - -config-dir=/etc/swarm-device-access
      - --
      # Daemon flags, passed to the daemon verbatim.
      # Reload the config file with: docker kill -s HUP swarm-device-access
      # - -config=/etc/swarm-device-access/config.yaml
      # Restrict to disk devices only, one glob per flag: flags are not split
      # on commas (only the labels are):
      # - -device-allow=/dev/sd*
      # - -device-allow=/dev/nvme*
      # - -device-allow=/dev/sg*
      # - -device-allow=/dev/disk/*
    # Leaves time for the launcher to stop the daemon and drain its logs.
    stop_grace_period: 30s
    deploy:
      mode: global
      restart_policy:
        condition: any
      update_config:
        order: stop-first
