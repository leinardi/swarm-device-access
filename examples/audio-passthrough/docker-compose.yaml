# Audio device passthrough example for Docker Swarm
#
# Passes /dev/snd (ALSA sound devices) into a worker container.
#
# Prerequisites:
#   - ALSA devices present at /dev/snd on the host
#
# Deploy:
#   docker stack deploy -c docker-compose.yaml audio-example

services:
  audio-worker:
    image: ubuntu:24.04
    volumes:
      # /dev/snd is a directory; the daemon walks it and applies a rule per device.
      - /dev/snd:/dev/snd
    command: [ "aplay", "-l" ]
    # Use top-level labels: — deploy.labels: are only visible on manager nodes.
    labels:
      swarm-device-access.enable: "true"
      swarm-device-access.device-allow: "/dev/snd/*"
    deploy:
      mode: replicated
      replicas: 1
  swarm-device-access:
    image: docker:29
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - run
      - -i
      - --rm
      - --name=swarm-device-access
      - --privileged
      - --cgroupns=host
      - --pid=host
      - --userns=host
      - -v
      - /sys:/host/sys
      - -v
      - /var/run/docker.sock:/var/run/docker.sock
      - -v
      - /dev:/dev
      # Restrict to ALSA sound devices only:
      # - -device-allow=/dev/snd/*
      - ghcr.io/leinardi/swarm-device-access:latest
    entrypoint: docker
    deploy:
      mode: global
      restart_policy:
        condition: any
