services:
  swarm-device-access:
    image: ghcr.io/leinardi/swarm-device-access:1

    volumes:
      # The launcher only needs the host Docker socket: it creates the daemon
      # container through the Docker API.
      - /var/run/docker.sock:/var/run/docker.sock

    # Swarm rejects privileged/cgroup/pid/userns on services. The launcher runs
    # unprivileged and creates the daemon container from this same image, with
    # the documented privileged set: --privileged, host cgroup, pid and user
    # namespaces, no network, and binds for the Docker socket, /sys and /dev.
    command:
      - launch
      # Launcher flags. Bind the host's systemd DBus socket, so the daemon
      # reapplies device rules after systemctl daemon-reload, which wipes cgroup
      # BPF programs (without it the daemon warns and skips reload handling):
      # - -dbus
      # Bind a host directory read-only at /etc/swarm-device-access, for -config
      # below. Mount the directory, not the file: an editor that replaces the
      # file would leave a file mount on the old content, and a reload would
      # silently apply it.
      # - -config-dir=/etc/swarm-device-access
      # Run the daemon in the host network, needed for -metrics-addr/-debug-addr:
      # - -host-network
      - --
      # Daemon flags, passed to the daemon verbatim.
      # Reload the config file with: docker kill -s HUP swarm-device-access
      # - -config=/etc/swarm-device-access/config.yaml
      - -log-level=info
      - -log-format=text

    restart: unless-stopped

    deploy:
      mode: global
      restart_policy:
        condition: any
      # One daemon per node: the new launcher must not start while the old one
      # still owns the node's daemon.
      update_config:
        order: stop-first

    # The launcher's shutdown (stop the daemon with a 10s grace period, wait
    # for its removal, drain its last log lines) takes at most 20s.
    stop_grace_period: 30s
