[package]
name = "testenv"
version = "0.0.0"
description = "Integration harness for swarm-device-access, against the host Docker daemon"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# integration is Go's integration build tag: it compiles the modules that talk to the host Docker
# daemon (the client, the sweep, the image runs) and the suite, and turns on testenv-core's async,
# bollard and redact features with them. Without it, only the suite's names and labels, the image
# identity rule and the enforcement tests' guards and program checks build, and their tests run in
# a plain cargo test, which needs no Docker and does not build bollard. Build and clippy take
# --all-features, so the gated code is still compiled and linted.
[features]
integration = [
    "testenv-core/async",
    "testenv-core/bollard",
    "testenv-core/redact",
    "dep:bollard",
    "dep:futures-util",
]

[dependencies]
# The label and launcher constants the suite checks. The dependency only goes this way: the daemon package names testenv in no table (the
# docker_boundary meta-test checks its sources), so nothing here reaches the shipped binary.
swarm-device-access = { path = ".." }
# The wall clock the harness and its logs read.
clock.workspace = true
# What the daemon crate logs through (its events, in the helper that dumps the filters).
tracing.workspace = true
tracing-setup.workspace = true
# The generic half of the harness (rust-common): Go's -run filter, the envid, the sweep rules and
# the owner labels, the error type, the identity answer and the ELF check, and (with integration)
# Go's context and testing packages, the redacting logger and the host daemon's sweep and
# cleanup. Its features follow integration, so a plain cargo test does not build bollard.
testenv-core.workspace = true
# The Docker SDK, for the harness only, which creates and removes containers and images on
# purpose. An optional normal dependency, not a dev-dependency: the suite reaches it through this
# library's API, and a dev-dependency is not available to library code. Only the unix socket
# (pipe): the harness drives the local host daemon, so neither TCP nor TLS is built.
bollard = { version = "=0.21.1", default-features = false, features = ["pipe"], optional = true }
futures-util = { version = "0.3.34", default-features = false, features = [
    "std",
], optional = true }

# The suite's own needs, beside the library's: the daemon child processes and the docker build of
# the negative control's image, the metrics request, the daemon's JSON log records and the device
# numbers.
[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "sync",
    "time",
] }
serde_json = "1.0.154"
# The major and minor of a device number for the enforcement tests' neighbouring nodes, without
# unsafe code.
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
harness = false
required-features = ["integration"]
