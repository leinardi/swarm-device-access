[package]
name = "testenv"
version = "0.0.0"
description = "Integration harness for swarm-device-access, against the host Docker daemon"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The integration suite and the harness code it needs (bollard, the host Docker daemon) sit behind
# this feature, so a plain `cargo test --workspace` needs no Docker. Build and clippy take
# --all-features, so that code is still compiled and linted.
[features]
integration = []
